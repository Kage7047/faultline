name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write     # create the release
  id-token: write     # sign the provenance attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: tests must pass on the tagged commit
        run: go test -short ./...
      - name: build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            name=faultline_${GITHUB_REF_NAME}_${os}_${arch}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "$name/faultline" ./cmd/faultline
            cp README.md LICENSE "$name/"
            tar -czf "dist/$name.tar.gz" "$name"
          done
          cd dist && sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: .github/release-notes/${{ github.ref_name }}.md
