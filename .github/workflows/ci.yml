name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: unit tests, 200 seeds and the controls
        run: go test -v ./...
      - name: race detector
        run: |
          go test -race ./raft ./wal
          go test -race -short -run 'TestSafety|TestLiveness|TestRunIsDeterministic' ./sim

  # the real binary: three processes, kill -9 and SIGSTOP of the leader, Porcupine on the history
  chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 60 s of faults, then the stale-read control
        run: go test ./chaos -chaos -chaos.duration 60s -chaos.report chaos.json -chaos.dir chaos-out -v -timeout 10m
      - name: summary
        if: always()
        run: |
          if [ -f chaos.json ]; then
            { echo '### chaos run'; echo '```json'; cat chaos.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: keep logs and the failing history
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-out
          path: chaos-out

  # a different 2,000 seeds on every push: the more seeds ever run, the more the passing result means
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 2,000 fresh consensus seeds per mode
        run: go test ./sim -run TestSafety -seeds 2000 -from $(( (${{ github.run_number }} * 2000) + 1000 )) -v
      - name: 300 fresh linearizability seeds per mode
        run: go test ./sim -run TestLinearizable -kvseeds 300 -from $(( (${{ github.run_number }} * 300) + 1000 )) -v -timeout 30m
